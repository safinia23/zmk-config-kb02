manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: infused-kim
      url-base: https://github.com/infused-kim

  projects:
    #
    # ZMK 本体 — どちらか一方だけ有効にする
    #

    # (1) まずはこれ：infused-kim の fork。PS/2 ドライバモジュールと動く組み合わせとして既知。
    - name: zmk
      remote: infused-kim
      revision: pr-testing/mouse_ps2_module_base
      import: app/west.yml

    # (2) 2 回目に試す：ZMK main（pointing 統合済み）。通れば main に乗り換える。
    #     通らなければ (1) に戻す。main で使う場合、keymap 側の
    #     `behaviors/mouse_keys.dtsi` include と `zmk,input-listener-ps2` の
    #     compatible 名がエラーになる可能性が高い（README 参照）。
    # - name: zmk
    #   remote: zmkfirmware
    #   revision: main
    #   import: app/west.yml

    #
    # PS/2 Mouse & TrackPoint ドライバモジュール
    #
    - name: kb_zmk_ps2_mouse_trackpoint_driver
      remote: infused-kim
      revision: main

  self:
    path: config
