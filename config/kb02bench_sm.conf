# kb02bench_sm — ベンチ用設定（BLE は build.yaml の -DCONFIG_ZMK_BLE=n で無効）

# BLE を切ると ZMK が settings を無効化するが、PS/2 ドライバは CONFIG_SETTINGS=n を想定しておらず
# リンクエラー（zmk_mouse_ps2_settings_reset_setting 未定義）になる → 明示的に有効化
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# USB ログ（ベンチ中は ON。TP の初期化ログが見える。本番では切る）
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=3000

# スリープ（ベンチ中は OFF の方が扱いやすい。電流測定のときだけ ON）
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
